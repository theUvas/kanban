<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.18" y2="1">
      <stop offset="0%" stop-color="#2A2824"/>
      <stop offset="100%" stop-color="#141312"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFEFB"/>
      <stop offset="100%" stop-color="#EEECE6"/>
    </linearGradient>
    <linearGradient id="col" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8F7F4"/>
      <stop offset="100%" stop-color="#EDEBE5"/>
    </linearGradient>
    <filter id="boardShadow" x="-20%" y="-10%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <filter id="cardShadow" x="-15%" y="-15%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1A1A18" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Full-bleed canvas; macOS applies the squircle -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <ellipse cx="512" cy="210" rx="460" ry="280" fill="#FFF8EC" opacity="0.07"/>

  <!-- Paper board -->
  <rect x="148" y="176" width="728" height="672" rx="92" fill="url(#board)" filter="url(#boardShadow)"/>

  <!-- Columns -->
  <g>
    <rect x="188" y="224" width="196" height="576" rx="36" fill="url(#col)"/>
    <rect x="414" y="224" width="196" height="576" rx="36" fill="url(#col)"/>
    <rect x="640" y="224" width="196" height="576" rx="36" fill="url(#col)"/>
  </g>

  <!-- Column marks -->
  <rect x="254" y="248" width="64" height="12" rx="6" fill="#2563EB"/>
  <rect x="480" y="248" width="64" height="12" rx="6" fill="#B45309"/>
  <rect x="706" y="248" width="64" height="12" rx="6" fill="#0F7A4A"/>

  <!-- Cards: to-do (blue) -->
  <g filter="url(#cardShadow)">
    <rect x="204" y="284" width="164" height="92" rx="22" fill="#FFFFFF"/>
    <rect x="204" y="396" width="164" height="92" rx="22" fill="#FFFFFF"/>
    <rect x="204" y="508" width="164" height="92" rx="22" fill="#FFFFFF"/>
  </g>
  <rect x="204" y="284" width="10" height="92" rx="5" fill="#2563EB"/>
  <rect x="204" y="396" width="10" height="92" rx="5" fill="#2563EB"/>
  <rect x="204" y="508" width="10" height="92" rx="5" fill="#2563EB"/>
  <rect x="230" y="312" width="102" height="10" rx="5" fill="#D9D7D0"/>
  <rect x="230" y="332" width="72" height="10" rx="5" fill="#E8E6E0"/>
  <rect x="230" y="424" width="96" height="10" rx="5" fill="#D9D7D0"/>
  <rect x="230" y="444" width="58" height="10" rx="5" fill="#E8E6E0"/>
  <rect x="230" y="536" width="88" height="10" rx="5" fill="#D9D7D0"/>
  <rect x="230" y="556" width="64" height="10" rx="5" fill="#E8E6E0"/>

  <!-- Cards: doing (amber) -->
  <g filter="url(#cardShadow)">
    <rect x="430" y="284" width="164" height="92" rx="22" fill="#FFFFFF"/>
    <rect x="430" y="396" width="164" height="92" rx="22" fill="#FFFFFF"/>
  </g>
  <rect x="430" y="284" width="10" height="92" rx="5" fill="#B45309"/>
  <rect x="430" y="396" width="10" height="92" rx="5" fill="#B45309"/>
  <rect x="456" y="312" width="108" height="10" rx="5" fill="#D9D7D0"/>
  <rect x="456" y="332" width="66" height="10" rx="5" fill="#E8E6E0"/>
  <rect x="456" y="424" width="90" height="10" rx="5" fill="#D9D7D0"/>
  <rect x="456" y="444" width="52" height="10" rx="5" fill="#E8E6E0"/>

  <!-- Card: done (green) -->
  <g filter="url(#cardShadow)">
    <rect x="656" y="284" width="164" height="92" rx="22" fill="#E7F4EC"/>
  </g>
  <rect x="656" y="284" width="10" height="92" rx="5" fill="#0F7A4A"/>
  <circle cx="774" cy="330" r="22" fill="#0F7A4A"/>
  <path d="M763.5 330.5 l7 7 14.5-15" fill="none" stroke="#E7F4EC" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
